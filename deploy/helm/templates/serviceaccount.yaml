{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bff-signup.labels" . | nindent 4 }}
# The service never calls the Kubernetes API (the Istio sidecar uses its own
# projected token), so no API token is mounted.
automountServiceAccountToken: false
{{- end }}
