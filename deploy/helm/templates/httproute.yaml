{{- if .Values.ingress.enabled }}
# Gateway API HTTPRoute — attaches to the Envoy Gateway for signup.bcbpsolutions.com.
#
# The signup page and API share the same origin so no CORS headers are needed.
# No jwt_authn / ext_authz filter — this is a public unauthenticated carve-out
# (LLD §5.1, §10.4, §13.1, BFF-4).
#
# TLS termination is configured on the Gateway listener, not here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "bff-signup.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bff-signup.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ required "ingress.gateway.name is required when ingress.enabled is true" .Values.ingress.gateway.name }}
      {{- with .Values.ingress.gateway.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.ingress.gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    - {{ required "env.PUBLIC_HOST is required for the HTTPRoute" .Values.env.PUBLIC_HOST | quote }}
  rules:
    # SB-5 paid signup waits on Billing B-I1 and RP-2: its own, longer timeout.
    - matches:
        - path:
            type: Exact
            value: "/api/v1/signup/paid"
          method: POST
      timeouts:
        request: {{ .Values.ingress.timeouts.paid | quote }}
      backendRefs:
        - name: {{ include "bff-signup.fullname" . }}
          port: {{ .Values.service.port }}
    # All other signup API routes under /api/v1/signup.
    # /healthz and /readyz are deliberately not routed: they are for the
    # kubelet only, and every public /readyz call would ping Valkey.
    - matches:
        - path:
            type: PathPrefix
            value: "/api/v1/signup"
      timeouts:
        request: {{ .Values.ingress.timeouts.default | quote }}
      backendRefs:
        - name: {{ include "bff-signup.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
