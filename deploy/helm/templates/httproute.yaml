{{- if .Values.ingress.enabled }}
# Gateway API HTTPRoute — attaches to the Envoy Gateway for signup.bcbpsolutions.com.
#
# The signup page and API share the same origin so no CORS headers are needed.
# No jwt_authn / ext_authz filter — this is a public unauthenticated carve-out
# (LLD §5.1, §10.4, §13.1, BFF-4).
#
# TLS termination is configured on the Gateway listener, not here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "bff-signup.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bff-signup.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ required "ingress.gateway.name is required when ingress.enabled is true" .Values.ingress.gateway.name }}
      {{- with .Values.ingress.gateway.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.ingress.gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    - {{ .Values.publicHost | quote }}
  rules:
    # All signup API routes under /api/v1/signup
    - matches:
        - path:
            type: PathPrefix
            value: "/api/v1/signup"
      backendRefs:
        - name: {{ include "bff-signup.fullname" . }}
          port: {{ .Values.service.port }}
    # Health probes — reachable from infra without authentication
    - matches:
        - path:
            type: Exact
            value: "/healthz"
      backendRefs:
        - name: {{ include "bff-signup.fullname" . }}
          port: {{ .Values.service.port }}
    - matches:
        - path:
            type: Exact
            value: "/readyz"
      backendRefs:
        - name: {{ include "bff-signup.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
