{{- if .Values.serviceEntry.enabled }}
# Istio ServiceEntry — lets the sidecar reach Cloudflare Turnstile when the mesh
# runs outboundTrafficPolicy: REGISTRY_ONLY (LLD §10.1, §13.1 G-6). Without it
# every CAPTCHA check fails and every signup returns 503.
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: {{ include "bff-signup.fullname" . }}-turnstile
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bff-signup.labels" . | nindent 4 }}
spec:
  hosts:
    - {{ .Values.serviceEntry.turnstileHost | quote }}
  location: MESH_EXTERNAL
  resolution: DNS
  ports:
    - number: 443
      name: https
      protocol: TLS
  # Visible to this namespace only: no other workload gains internet egress.
  exportTo:
    - "."
{{- end }}
