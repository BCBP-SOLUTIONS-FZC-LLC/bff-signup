# SLO recording rules + burn-rate alerts for bff-signup (LLD §11.1).
#
#  SLO-1  Signup availability
#         Target: 99.9% of POST /api/v1/signup/trial and /paid requests return
#         a non-5xx status.
#  SLO-2  Provisioning success
#         Target: 99% of submitted signups (SB-2 + SB-5) reach state=completed.
#
# SLIs aggregate by (domain, service, environment) — the standard's identity
# labels — so each environment burns its own budget.
#
# metric_status: proposed — SLO-1 reads platform_http_requests_total, the HTTP
# server counter platform-gincommon emits for every route (labels method,
# route = Gin route template, status_class, error_class). It is still Proposed
# in the Platform Observability Registry, so the alerts built on it carry the
# label metric_status: proposed (same as iam-org-membership). SLO-2 reads
# Tier 3 bff_signup_* metrics, which need no ratification.
#
# Deployed copy: deploy/helm/templates/prometheusrule.yaml (kept identical;
# .github/scripts/monitoring-rules-sync.py checks it).

groups:
  # ── SLI recording ─────────────────────────────────────────────────────────
  - name: bff-signup.slo.records
    interval: 30s
    rules:
      # SLO-1 error ratio (5xx / all) on the two signup submit routes.
      # metric_status: proposed (platform_http_requests_total).
      - record: bff:signup_error_ratio:rate_5m
        expr: |
          sum by (domain, service, environment) (rate(platform_http_requests_total{
            service="bff-signup", method="POST",
            route=~"/api/v1/signup/(trial|paid)", status_class="5xx"
          }[5m]))
          /
          clamp_min(sum by (domain, service, environment) (rate(platform_http_requests_total{
            service="bff-signup", method="POST",
            route=~"/api/v1/signup/(trial|paid)"
          }[5m])), 0.001)

      # metric_status: proposed (platform_http_requests_total).
      - record: bff:signup_error_ratio:rate_1h
        expr: |
          sum by (domain, service, environment) (rate(platform_http_requests_total{
            service="bff-signup", method="POST",
            route=~"/api/v1/signup/(trial|paid)", status_class="5xx"
          }[1h]))
          /
          clamp_min(sum by (domain, service, environment) (rate(platform_http_requests_total{
            service="bff-signup", method="POST",
            route=~"/api/v1/signup/(trial|paid)"
          }[1h])), 0.001)

      # SLO-2 provisioning success: completed / submitted (Tier 3).
      - record: bff:provisioning_success_ratio:rate_1h
        expr: |
          sum by (domain, service, environment) (rate(bff_signup_provisioning_succeeded_total[1h]))
          /
          clamp_min(sum by (domain, service, environment) (rate(bff_signup_form_submitted_total[1h])), 0.001)

  # ── Burn-rate alerts (multi-window) ───────────────────────────────────────
  - name: bff-signup.slo.alerts
    rules:
      # Fast burn: > 14.4× the 0.1% budget over 5 min → outage in progress.
      - alert: SignupSLOFastBurn
        expr: |
          bff:signup_error_ratio:rate_5m > (14.4 * (1 - 0.999))
        for: 2m
        labels:
          severity: critical
          team: web-growth
          metric_status: proposed
        annotations:
          summary: bff-signup burning error budget at 14.4× (fast burn — outage)
          description: >-
            Signup availability SLO (99.9%) is burning at >14.4× the allowed rate.
            At this pace the monthly budget exhausts in about two days of a 30-day month.
          runbook: "docs/observability/runbooks.md#signupslofastburn"

      # Slow burn: > 2× the budget over 1 h → gradual degradation.
      - alert: SignupSLOSlowBurn
        expr: |
          bff:signup_error_ratio:rate_1h > (2 * (1 - 0.999))
        for: 15m
        labels:
          severity: warning
          team: web-growth
          metric_status: proposed
        annotations:
          summary: bff-signup burning error budget at 2× (slow burn — degradation)
          description: >-
            Signup availability SLO (99.9%) has been burning at >2× the allowed rate
            for 15 minutes.
          runbook: "docs/observability/runbooks.md#signupsloslowburn"

      # SLO-2: under 99% of submitted signups completing over the last hour.
      # Only when there is traffic (≥ 0.01 submissions/s, about 36 an hour).
      - alert: SignupProvisioningSLOBreach
        expr: |
          bff:provisioning_success_ratio:rate_1h < 0.99
            and on (domain, service, environment)
          sum by (domain, service, environment) (rate(bff_signup_form_submitted_total[1h])) > 0.01
        for: 30m
        labels:
          severity: warning
          team: web-growth
        annotations:
          summary: bff-signup provisioning success below 99% (SLO-2)
          description: >-
            {{ $value | humanizePercentage }} of submitted signups completed in the last hour.
          runbook: "docs/observability/runbooks.md#signupprovisioningslobreach"
