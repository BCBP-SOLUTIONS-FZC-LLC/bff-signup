# Prometheus Adapter ConfigMap — exposes bff-signup's per-pod request rate on the
# Custom Metrics API as platform_http_requests_per_second.
#
# Not used for scaling today: the HPA (deploy/helm/templates/hpa.yaml) is
# CPU-only by design (LLD §13.1, G-9 — PBKDF2 hashing is CPU-bound). This rule
# exists so a request-rate HPA metric can be added without a new adapter rule.
#
# metric_status: proposed — platform_http_requests_total (platform-gincommon's
# HTTP server counter) is still Proposed in the Platform Observability Registry.
# An HPA that starts using this metric must carry the annotation
# observability.platform/metric-status: proposed (same as iam-org-membership).
#
# Deploy into the namespace where prometheus-adapter runs (typically observability).
# Merge with any existing prometheus-adapter ConfigMap rather than replacing it.
#
# After applying, verify:
#   kubectl get --raw /apis/custom.metrics.k8s.io/v1beta1 | jq '.resources[].name' | grep per_second
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-adapter-config-bff-signup
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus-adapter
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: bff-signup
  annotations:
    observability.platform/metric-status: proposed
data:
  config.yaml: |
    rules:
      - seriesQuery: 'platform_http_requests_total{service="bff-signup",namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          matches: "^(.*)_total$"
          as: "${1}_per_second"
        metricsQuery: |
          sum(rate(<<.Series>>{<<.LabelMatchers>>}[2m])) by (<<.GroupBy>>)
