# Prometheus alerting rules for the Signup BFF (bff-signup), LLD §11.5.
#
# Metric tiers (Enterprise Platform Observability Standard):
#   Tier 3 bff_signup_*  — this service's own metrics (authoritative here).
#   Tier 1 platform_*    — not queried here; the SLO alerts in slo-rules.yml use
#                          platform_http_requests_total (platform-gincommon,
#                          Proposed) and carry metric_status: proposed.
# Every series carries the identity labels domain="bff", service="bff-signup",
# environment, injected centrally by platform-gincommon.
#
# Deployed copy: deploy/helm/templates/prometheusrule.yaml renders these groups
# and slo-rules.yml as one PrometheusRule. Keep the rule names and expressions
# identical (checked in CI by .github/scripts/monitoring-rules-sync.py). This
# flat file is for non-kube-prometheus setups (Prometheus --rule-files).
#
# On-call: Web/Growth primary; IAM escalation for RP / O&M, Commercial for Billing.
# Runbooks: docs/observability/runbooks.md (one heading per alert).

groups:
  # ── Availability ─────────────────────────────────────────────────────────────
  - name: bff_signup_availability
    rules:
      - alert: SignupBFFDown
        expr: |
          absent(up{job="bff-signup"} == 1)
        for: 2m
        labels:
          severity: critical
          team: web-growth
        annotations:
          summary: bff-signup has no healthy instances
          description: >-
            No bff-signup pods have been scraped as healthy for 2 minutes.
            Check pod readiness: kubectl get pods -l app.kubernetes.io/name=bff-signup
          runbook: "docs/observability/runbooks.md#signupbffdown"

      - alert: SignupBFFReplicasMissing
        expr: |
          sum(up{job="bff-signup"}) < 2
        for: 5m
        labels:
          severity: warning
          team: web-growth
        annotations:
          summary: bff-signup running below minimum replica count
          description: >-
            Fewer than 2 replicas are healthy (minReplicas=2, LLD §13.1).
          runbook: "docs/observability/runbooks.md#signupbffreplicasmissing"

  # ── Provisioning funnel ───────────────────────────────────────────────────────
  - name: bff_signup_provisioning
    rules:
      - alert: SignupProvisioningFailureRate
        expr: |
          sum by (domain, service, environment) (rate(bff_signup_provisioning_failed_total[10m]))
            /
          clamp_min(sum by (domain, service, environment) (rate(bff_signup_form_submitted_total[10m])), 0.001)
          > 0.05
        for: 10m
        labels:
          severity: warning
          team: web-growth
        annotations:
          summary: Signup provisioning failure rate above 5%
          description: >-
            {{ $value | humanizePercentage }} of signups are failing provisioning.
            Filter bff_signup_provisioning_failed_total by mode/stage/reason.
          runbook: "docs/observability/runbooks.md#signupprovisioningfailurerate"

      - alert: SignupOrgMembershipLag
        expr: |
          sum by (domain, service, environment) (increase(bff_signup_provisioning_failed_total{stage="org_membership",reason="exhausted"}[15m])) > 0
        for: 0m
        labels:
          severity: warning
          team: web-growth
        annotations:
          summary: Signup stuck in tenant_pending — O&M not completing I-1
          description: >-
            Signups have been in tenant_pending for 15 minutes without completing.
            Check O&M health and the TenantIdentityProvisioned SNS filter for tenant-orgm-q.
          runbook: "docs/observability/runbooks.md#signuporgmembershiplag"

      - alert: SignupContractError
        expr: |
          sum by (domain, service, environment) (increase(bff_signup_provisioning_failed_total{reason="contract_error"}[5m])) > 0
        for: 0m
        labels:
          severity: critical
          team: web-growth
        annotations:
          summary: Signup BFF IAM contract mismatch — page required
          description: >-
            RP or I-1 returned an unexpected error (e.g. INVALID_REQUEST for plan).
            This is a BFF bug or an IAM contract change.
          runbook: "docs/observability/runbooks.md#signupcontracterror"

      - alert: SignupRealmProvisionerUnavailable
        expr: |
          sum by (domain, service, environment) (rate(bff_signup_dependency_call_duration_seconds_count{dependency="realm_provisioner",outcome="error"}[5m]))
            /
          clamp_min(sum by (domain, service, environment) (rate(bff_signup_dependency_call_duration_seconds_count{dependency="realm_provisioner"}[5m])), 0.001)
          > 0.2
        for: 5m
        labels:
          severity: warning
          team: web-growth
        annotations:
          summary: Realm Provisioner failing for signup
          description: >-
            More than 20% of RP-1/RP-2 calls are failing (transport error or 5xx).
            Users cannot complete signups. Check iam-realm-provisioner and Keycloak.
          runbook: "docs/observability/runbooks.md#signuprealmprovisionerunavailable"

      - alert: SignupBillingUnavailable
        expr: |
          sum by (domain, service, environment) (rate(bff_signup_dependency_call_duration_seconds_count{dependency="billing",outcome="error"}[10m]))
            /
          clamp_min(sum by (domain, service, environment) (rate(bff_signup_dependency_call_duration_seconds_count{dependency="billing"}[10m])), 0.001)
          > 0.2
        for: 10m
        labels:
          severity: warning
          team: web-growth
        annotations:
          summary: Billing B-I1 failing for paid signup
          description: >-
            More than 20% of Billing authorize-and-charge calls are failing (transport
            error or 5xx). Paid signups get 503 + Retry-After; handoffs are kept and
            resubmits reuse the same charge key, so nothing is charged twice (LLD §19.4).
          runbook: "docs/observability/runbooks.md#signupbillingunavailable"

      - alert: SignupBackstopActivityHigh
        expr: |
          sum by (environment) (increase(iam_org_membership_tenant_provisioning_backstop_total{result="created"}[15m])) > 5
        for: 0m
        labels:
          severity: warning
          team: web-growth
        annotations:
          summary: O&M backstop creating tenants — BFF I-1 failing
          description: >-
            The O&M backstop created {{ $value }} tenants in the last 15 minutes,
            meaning the BFF's I-1 calls are failing and browsers are abandoning signups.
          runbook: "docs/observability/runbooks.md#signupbackstopactivityhigh"

  # ── Abuse controls ────────────────────────────────────────────────────────────
  - name: bff_signup_abuse_controls
    rules:
      - alert: SignupCaptchaErrorRate
        expr: |
          sum by (domain, service, environment) (rate(bff_signup_captcha_challenged_total{result="error"}[5m]))
            /
          clamp_min(sum by (domain, service, environment) (rate(bff_signup_captcha_challenged_total[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
          team: web-growth
        annotations:
          summary: Turnstile CAPTCHA error rate above 5%
          description: >-
            {{ $value | humanizePercentage }} of CAPTCHA verifications are erroring
            (not failures — errors mean Turnstile is unreachable).
            Check the ServiceEntry for challenges.cloudflare.com:443.
          runbook: "docs/observability/runbooks.md#signupcaptchaerrorrate"

  # ── Infrastructure ────────────────────────────────────────────────────────────
  - name: bff_signup_infrastructure
    rules:
      - alert: SignupValkeyDown
        expr: |
          kube_pod_container_ready{container="bff-signup"} == 0
        for: 2m
        labels:
          severity: critical
          team: web-growth
        annotations:
          summary: bff-signup readiness failing — likely Valkey unreachable
          description: >-
            The bff-signup readiness probe (/readyz, pings Valkey) is failing.
            All signup endpoints return 503 (fail-closed, LLD §6, N-7).
          runbook: "docs/observability/runbooks.md#signupvalkeydown"
