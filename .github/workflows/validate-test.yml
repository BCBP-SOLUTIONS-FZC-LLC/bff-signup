# Reusable workflow — test gate.
# Race detector (unit + integration with real Valkey) + coverage gate + arch lint.
# Called by ci.yml. Gates trivy and smoke.
name: Validate / Test

"on":
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out (leave empty to use the caller ref)'
        type: string
        required: false
        default: ''
    outputs:
      pct:
        description: 'Total statement coverage percentage'
        value: ${{ jobs.test.outputs.pct }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pct: ${{ steps.gate.outputs.pct }}

    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Download modules
        env:
          GOPRIVATE: github.com/BCBP-SOLUTIONS-FZC-LLC/*
          GONOSUMDB: github.com/BCBP-SOLUTIONS-FZC-LLC/*
        run: go mod download

      - name: Verify modules
        run: go mod verify

      # Full test suite with race detector and coverage.
      # Real Valkey is available at localhost:6379 via the service container.
      # Any data race blocks all downstream jobs.
      - name: Tests — unit + integration (race + coverage)
        env:
          VALKEY_URL: redis://localhost:6379/0
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: make test-ci

      - name: Coverage threshold gate (>= 95%)
        id: gate
        run: bash .github/scripts/coverage-gate.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 30

      - name: Cache go-arch-lint binary
        uses: actions/cache@v6.1.0
        with:
          path: ~/go/bin
          key: go-arch-lint-${{ runner.os }}-v1.15.0

      - name: Architecture lint
        run: bash .github/scripts/arch-lint.sh
