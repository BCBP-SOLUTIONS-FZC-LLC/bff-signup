name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bcbp-solutions-fzc-llc/bff-signup

permissions:
  contents: read
  packages: write

jobs:
  # ── Parallel: quality + tests + build ────────────────────────────────────
  validate-quality:
    name: Quality
    uses: ./.github/workflows/validate-quality.yml
    secrets: inherit

  validate-test:
    name: Tests
    uses: ./.github/workflows/validate-test.yml
    secrets: inherit

  build-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (and push on main)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GOPRIVATE=github.com/BCBP-SOLUTIONS-FZC-LLC/*
          secrets: |
            GO_PRIVATE_TOKEN=${{ secrets.GO_PRIVATE_TOKEN }}

  # ── Gated: smoke + trivy ─────────────────────────────────────────────────
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: [validate-test, build-image]
    steps:
      - uses: actions/checkout@v4

      - name: Tag image for smoke tests
        run: docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} bff-signup-ci-test 2>/dev/null || true

      - name: Run smoke tests
        run: bash .github/scripts/smoke-tests.sh

  trivy-scan:
    name: Trivy vulnerability scan
    runs-on: ubuntu-latest
    needs: [validate-test, build-image]
    if: github.event_name == 'push'
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    needs: [validate-quality]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/ -f deploy/helm/values-dev.yaml
