# CI for bff-signup
#
# Parallel flow:
#
#   validate-test ──────┐
#   build-image ────────┤──► trivy ──────┐
#                       │   smoke ───────┤──► pr-summary (PR events only)
#                       └────────────────┤──► push       (push events only, needs quality too)
#   validate-quality ───────────────────┘
#
# build-image lints the Dockerfile (Hadolint + .dockerignore check) before
# the expensive build — a lint failure never starts the build.
# build-image only caches; it never pushes. push is a separate job that runs
# only after validate-test + trivy + smoke + validate-quality all pass.
# trivy runs on all events (PR + push) so CVEs are caught before merge.
# pr-summary posts a status table on pull_request events.
#
# paths-ignore skips the pipeline for commits that only touch Markdown or
# architecture diagrams. A commit touching both docs and code runs normally.
#
name: CI

"on":
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/architecture/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/architecture/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  IMAGE_NAME: ghcr.io/bcbp-solutions-fzc-llc/bff-signup
  BUILDKIT_PROGRESS: plain

jobs:
  validate-test:
    name: Validate / Test
    uses: ./.github/workflows/validate-test.yml
    secrets: inherit

  validate-quality:
    name: Validate / Quality
    uses: ./.github/workflows/validate-quality.yml
    secrets: inherit

  build-image:
    name: Build image (cache)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008

      - name: Check .dockerignore exists
        run: test -f .dockerignore

      - name: Prepare Docker build
        id: cache
        env:
          REGISTRY_REF: ${{ env.IMAGE_NAME }}:buildcache
          CAN_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: bash .github/scripts/docker-build-prep.sh

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build image → cache (no push)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          pull: ${{ github.event_name != 'pull_request' }}
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.cache.outputs.SOURCE_DATE_EPOCH }}
          secrets: |
            go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}

  trivy:
    name: Trivy CVE scan
    runs-on: ubuntu-latest
    needs: [validate-test, build-image]
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Load image from cache
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: bff-signup-ci-test
          cache-from: |
            type=gha
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          build-args: BUILD_VERSION=${{ github.sha }}
          secrets: |
            go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}

      - name: Cache Trivy DB
        uses: actions/cache@v6.1.0
        with:
          path: /tmp/trivy-cache
          key: trivy-db-${{ runner.os }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: Trivy scan — CRITICAL / HIGH (exit 1)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: bff-signup-ci-test
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH,UNKNOWN
          ignore-unfixed: true
          trivyignores: .trivyignore
          cache-dir: /tmp/trivy-cache

      - name: Trivy scan — SARIF upload
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: bff-signup-ci-test
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          ignore-unfixed: true
          trivyignores: .trivyignore
          cache-dir: /tmp/trivy-cache

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.37.4
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      - name: Trivy SBOM — CycloneDX
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: bff-signup-ci-test
          format: cyclonedx
          output: sbom.cyclonedx.json
          exit-code: '0'
          cache-dir: /tmp/trivy-cache

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 90

  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: [validate-test, build-image]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Load image from cache
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: bff-signup-ci-test
          cache-from: |
            type=gha
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          build-args: BUILD_VERSION=${{ github.sha }}
          secrets: |
            go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}

      - name: Smoke tests
        run: bash .github/scripts/smoke-tests.sh

  pr-summary:
    name: PR summary
    runs-on: ubuntu-latest
    needs: [validate-test, validate-quality, build-image, trivy, smoke]
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Post or update summary comment
        uses: actions/github-script@v9.0.0
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const fs = require('fs')
            const code = fs.readFileSync('.github/scripts/pr-summary.js', 'utf8')
            const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor
            const run = new AsyncFunction('github', 'context', 'core', 'require', 'process', code)
            await run(github, context, core, require, process)

  push:
    name: Push image → GHCR
    runs-on: ubuntu-latest
    needs: [validate-test, trivy, smoke, validate-quality]
    if: github.event_name == 'push'
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set SOURCE_DATE_EPOCH
        id: sde
        run: bash .github/scripts/set-source-date-epoch.sh

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build and push
        id: pushed
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.sde.outputs.SOURCE_DATE_EPOCH }}
          secrets: |
            go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image with Cosign
        run: |
          cosign sign --yes \
            "${{ env.IMAGE_NAME }}@${{ steps.pushed.outputs.digest }}"

      - name: Verify image signature
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/.github/workflows/.*@refs/heads/main$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.IMAGE_NAME }}@${{ steps.pushed.outputs.digest }}"

      - name: Log image digest
        env:
          IMAGE_DIGEST: ${{ steps.pushed.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: bash .github/scripts/log-image-digest.sh
