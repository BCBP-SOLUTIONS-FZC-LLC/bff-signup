basePath: /api/v1/signup
definitions:
  domain.PasswordPolicy:
    properties:
      max_length:
        type: integer
      min_length:
        type: integer
      not_email:
        type: boolean
      require_classes:
        type: integer
    type: object
  domain.Plan:
    enum:
    - starter
    - pro
    - enterprise
    type: string
    x-enum-varnames:
    - PlanStarter
    - PlanPro
    - PlanEnterprise
  domain.PlanInfo:
    properties:
      code:
        $ref: '#/definitions/domain.Plan'
      name:
        type: string
      trial_days:
        type: integer
    type: object
  domain.SlugRules:
    properties:
      max:
        type: integer
      min:
        type: integer
      pattern:
        type: string
    type: object
  github_com_BCBP-SOLUTIONS-FZC-LLC_platform-gincommon_v2_internal_problem.FieldError:
    properties:
      field:
        description: Field is the JSON path of the invalid field (e.g. "deadline",
          "items[0].sku").
        type: string
      message:
        description: |-
          Message is a fixed phrase ("is required", "must be in the future"). It never
          echoes the rejected value, which may be PII.
        type: string
    type: object
  http.CaptchaInfo:
    properties:
      provider:
        type: string
      site_key:
        type: string
    type: object
  http.PaidSignupRequest:
    properties:
      accept_terms:
        type: boolean
      admin_email:
        type: string
      admin_name:
        type: string
      captcha_token:
        type: string
      company_name:
        type: string
      password:
        type: string
      payment_token:
        description: Stripe token from browser
        type: string
      plan:
        $ref: '#/definitions/domain.Plan'
      seats:
        maximum: 1000
        minimum: 1
        type: integer
      slug:
        type: string
      terms_version:
        type: string
    required:
    - admin_email
    - admin_name
    - captcha_token
    - company_name
    - password
    - payment_token
    - plan
    - seats
    - terms_version
    type: object
  http.PaidSignupResponse:
    properties:
      action:
        allOf:
        - $ref: '#/definitions/http.PaymentAction'
        description: status=payment_action_required only
      email_verification_sent:
        type: boolean
      expires_at:
        description: status=payment_action_required only
        type: string
      next:
        type: string
      poll_after_ms:
        type: integer
      signup_id:
        type: string
      status:
        type: string
    type: object
  http.PaymentAction:
    properties:
      client_secret:
        type: string
      type:
        description: '"3ds"'
        type: string
    type: object
  http.ProblemResponse:
    properties:
      detail:
        description: |-
          Detail is a sentence the service wrote about this occurrence. It never
          carries exception text, SQL, secrets or tenant information.
        type: string
      errorCode:
        description: ErrorCode is the stable, upper snake case, machine-readable code.
        type: string
      instance:
        description: Instance is the request path (never the query string, which may
          carry tokens).
        type: string
      status:
        description: Status is the HTTP status code; it always equals the response
          status.
        type: integer
      tenantId:
        description: TenantID is set only for a request with a verified tenant context.
        type: string
      timestamp:
        description: Timestamp is when the problem was created, formatted with TimestampLayout.
        type: string
      title:
        description: Title is the short, fixed summary of the type. It never varies
          per occurrence.
        type: string
      traceId:
        description: TraceID correlates the response with the server's logs and traces.
        type: string
      type:
        description: |-
          Type is the absolute, stable type URI ({base}/{domain}/{error}), or
          "about:blank" for a status without a registered type (RFC 9457 §4.2.1).
        type: string
      validationErrors:
        description: ValidationErrors lists the invalid fields of a validation-failed
          problem.
        items:
          $ref: '#/definitions/github_com_BCBP-SOLUTIONS-FZC-LLC_platform-gincommon_v2_internal_problem.FieldError'
        type: array
    type: object
  http.SessionResponse:
    properties:
      captcha:
        $ref: '#/definitions/http.CaptchaInfo'
      csrf_token:
        type: string
      current_terms_version:
        description: browser must echo this back in SB-2
        type: string
      password_policy:
        $ref: '#/definitions/domain.PasswordPolicy'
      plans:
        items:
          $ref: '#/definitions/domain.PlanInfo'
        type: array
      signup_id:
        type: string
      slug_rules:
        $ref: '#/definitions/domain.SlugRules'
    type: object
  http.SlugChangeRequest:
    properties:
      slug:
        type: string
    required:
    - slug
    type: object
  http.StatusResponse:
    properties:
      action:
        type: string
      message:
        type: string
      poll_after_ms:
        type: integer
      signup_id:
        type: string
      status:
        type: string
    type: object
  http.TrialSignupRequest:
    properties:
      accept_terms:
        type: boolean
      admin_email:
        type: string
      admin_name:
        type: string
      captcha_token:
        type: string
      company_name:
        type: string
      password:
        type: string
      plan:
        $ref: '#/definitions/domain.Plan'
      slug:
        type: string
      terms_version:
        type: string
    required:
    - admin_email
    - admin_name
    - captcha_token
    - company_name
    - password
    - plan
    - terms_version
    type: object
  http.TrialSignupResponse:
    properties:
      email_verification_sent:
        type: boolean
      next:
        type: string
      poll_after_ms:
        type: integer
      signup_id:
        type: string
      status:
        type: string
    type: object
host: signup.bcbpsolutions.com
info:
  contact:
    email: sharmila.dayalan@bcbpsolutions.com
    name: BCBP Solutions — Web / Growth
  description: |-
    Public trial-signup BFF for the XpertPMS platform.

    **Unauthenticated.** All routes are public — no JWT or tenant identity at signup time.
    Session identity is established by SB-1 (cookie + CSRF token); every state-changing route requires both.

    **Flow.** SB-1 → SB-2 → (if 202) poll SB-3 → (if 409 slug_taken) SB-4.

    **Rate limits.** 3 signups per IP per hour; 5 attempts per email per 24 hours; 20 sessions per IP per hour; 60 status polls per session per minute.
  license:
    name: Proprietary
  title: Signup BFF API
  version: 0.1.0
paths:
  /{signup_id}/slug:
    post:
      consumes:
      - application/json
      description: |-
        Retries I-1 tenant creation with a new slug. The Keycloak user from RP-1 is reused.
        Requires the handoff to be in slug_conflict state (signalled by SB-2 or SB-3 returning 409 slug_taken).
      parameters:
      - description: CSRF token from SB-1
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: Signup ID from SB-1
        in: path
        name: signup_id
        required: true
        type: string
      - description: New slug
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.SlugChangeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Signup fully provisioned with new slug
          schema:
            $ref: '#/definitions/http.TrialSignupResponse'
        "202":
          description: I-1 still in progress — poll SB-3
          schema:
            $ref: '#/definitions/http.TrialSignupResponse'
        "400":
          description: Slug validation failed
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "401":
          description: Session expired or missing
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "403":
          description: CSRF token invalid
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "404":
          description: Signup not found or does not belong to this session
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "409":
          description: New slug also taken — try again
          schema:
            $ref: '#/definitions/http.ProblemResponse'
      security:
      - SessionCookie: []
      - CSRFToken: []
      summary: Change slug after conflict (SB-4)
      tags:
      - signup
  /{signup_id}/status:
    get:
      description: |-
        Returns the current handoff state. Poll every `poll_after_ms` milliseconds after a 202 from SB-2.
        When status is "action_required" with action "choose_slug", submit SB-4 with a new slug.
        After 15 minutes in "provisioning", status becomes "failed".
      parameters:
      - description: Signup ID returned by SB-1
        in: path
        name: signup_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.StatusResponse'
        "401":
          description: Session expired or missing
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "404":
          description: Signup not found or does not belong to this session
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "429":
          description: Too many status polls (Retry-After header, seconds)
          schema:
            $ref: '#/definitions/http.ProblemResponse'
      security:
      - SessionCookie: []
      summary: Poll provisioning status (SB-3)
      tags:
      - signup
  /paid:
    post:
      consumes:
      - application/json
      description: |-
        Authorises and charges the Stripe payment token, then provisions
        a dedicated realm (RP-2) and tenant row (I-1) in one request.
      parameters:
      - description: CSRF token from SB-1
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: Paid signup payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.PaidSignupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Signup fully provisioned
          schema:
            $ref: '#/definitions/http.PaidSignupResponse'
        "202":
          description: 'Tenant still provisioning (status=provisioning, poll SB-3),
            or 3-D Secure needed (status=payment_action_required: complete action.client_secret,
            then re-POST the same body with a fresh captcha_token)'
          schema:
            $ref: '#/definitions/http.PaidSignupResponse'
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "401":
          description: Session expired or missing
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "403":
          description: CSRF token invalid or CAPTCHA failed
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "409":
          description: 'SLUG_TAKEN (+ suggestions): resubmit SB-5 with a new slug
            if paid but not yet provisioned, else SB-4; INVALID_STATE: a payment is
            in progress, or details changed after payment'
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "410":
          description: CHARGE_EXPIRED — 3-D Secure not completed in time; start a
            new signup
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "422":
          description: PAYMENT_DECLINED (+ decline_reason, top-level); use another
            payment method
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "429":
          description: Rate limit exceeded
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "503":
          description: Dependency unavailable; retry the same body after Retry-After
          schema:
            $ref: '#/definitions/http.ProblemResponse'
      security:
      - SessionCookie: []
      - CSRFToken: []
      summary: Submit direct paid signup (SB-5)
      tags:
      - signup
  /session:
    get:
      description: |-
        Creates an `sbff_sid` session cookie (30-min sliding TTL) and returns a CSRF token.
        Rate-limited to 20 session starts per IP per hour.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.SessionResponse'
        "429":
          description: Too many session starts from this IP (Retry-After header, seconds)
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "503":
          description: Valkey unavailable (fail-closed)
          schema:
            $ref: '#/definitions/http.ProblemResponse'
      summary: Start signup session (SB-1)
      tags:
      - session
  /trial:
    post:
      consumes:
      - application/json
      description: |-
        Runs the provisioning handoff. Returns 201 when fully provisioned, 202 when I-1 is still
        in progress (poll SB-3), or 409 when the slug is already taken (submit SB-4 with a new slug).
        Requires the session cookie and X-CSRF-Token header from SB-1.
        Rate-limited: 3 signups per IP per hour; 5 attempts per email per 24 hours.
      parameters:
      - description: CSRF token from SB-1
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: Signup form payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.TrialSignupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Signup fully provisioned
          schema:
            $ref: '#/definitions/http.TrialSignupResponse'
        "202":
          description: Keycloak user created; tenant still provisioning — poll SB-3
          schema:
            $ref: '#/definitions/http.TrialSignupResponse'
        "400":
          description: Validation failed (includes wrong Content-Type, unknown JSON
            fields)
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "401":
          description: Session expired or missing
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "403":
          description: CSRF token invalid or CAPTCHA failed
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "409":
          description: Slug already taken — submit SB-4 with a new slug; or INVALID_STATE
            (same signup already being processed) with retry_after_ms — retry
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "413":
          description: Request body larger than 16 KiB
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "429":
          description: Rate limit exceeded (Retry-After header, seconds)
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "503":
          description: Dependency unavailable (Valkey, Turnstile, RP-1)
          schema:
            $ref: '#/definitions/http.ProblemResponse'
      security:
      - SessionCookie: []
      - CSRFToken: []
      summary: Submit trial signup form (SB-2)
      tags:
      - signup
securityDefinitions:
  CSRFToken:
    description: CSRF token returned by SB-1 (GET /session). Required on all state-changing
      routes (POST). Must match the hash stored in the session cookie.
    in: header
    name: X-CSRF-Token
    type: apiKey
  SessionCookie:
    description: Session cookie set by SB-1 (GET /session). HttpOnly; Secure; SameSite=Strict;
      30-minute sliding TTL.
    in: cookie
    name: sbff_sid
    type: apiKey
swagger: "2.0"
